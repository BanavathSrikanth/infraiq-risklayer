trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

parameters:
  - name: enableDeploy
    displayName: Enable ACR/AKS deployment stages
    type: boolean
    default: false
  - name: azureServiceConnection
    displayName: Azure Resource Manager service connection name
    type: string
    default: ''
  - name: acrName
    displayName: Existing Azure Container Registry name
    type: string
    default: ''
  - name: aksResourceGroup
    displayName: Existing AKS resource group
    type: string
    default: ''
  - name: aksCluster
    displayName: Existing AKS cluster name
    type: string
    default: ''

variables:
  pythonVersion: '3.12'
  imageTag: '$(Build.SourceVersion)'

stages:
  - stage: Validate
    displayName: Validate Python services
    jobs:
      - job: PythonChecks
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - bash: |
              set -euo pipefail
              python -m pip install --disable-pip-version-check \
                ruff==0.11.2 mypy==1.15.0 bandit==1.8.3 types-PyYAML==6.0.12.20250915
              for service in apps/services/ai-orchestration-service apps/services/risk-service apps/services/integration-service; do
                if [ -f "$service/requirements.txt" ]; then
                  python -m pip install --disable-pip-version-check -r "$service/requirements.txt"
                fi
              done
              if [ -f apps/services/geospatial-service/requirements.txt ]; then
                python -m pip install --disable-pip-version-check -r apps/services/geospatial-service/requirements.txt
              fi
              if [ -f apps/services/integration-service/requirements.txt ]; then
                python -m pip install --disable-pip-version-check -r apps/services/integration-service/requirements.txt
              fi
              python -m compileall -q apps/services/ai-orchestration-service/app apps/services/risk-service/app
              python -m compileall -q apps/services/geospatial-service/app
              python -m compileall -q apps/services/integration-service/app
              ruff check \
                apps/services/ai-orchestration-service/app \
                apps/services/risk-service/app \
                apps/services/geospatial-service/app
              bandit -r \
                apps/services/ai-orchestration-service/app \
                apps/services/risk-service/app \
                apps/services/geospatial-service/app -q
              (cd apps/services/risk-service && \
                DATABASE_URL=sqlite:///ci-risk.db alembic upgrade head)
              rm -f apps/services/risk-service/ci-risk.db
              (cd apps/services/risk-service && \
                mypy --config-file ../../../pyproject.toml \
                  --explicit-package-bases app infrastructure)
              if [ -d apps/services/ai-orchestration-service/tests ]; then
                (cd apps/services/ai-orchestration-service && PYTHONPATH=.:../../.. python -m pytest -q tests)
              fi
              if [ -d apps/services/risk-service/tests ]; then
                (cd apps/services/risk-service && PYTHONPATH=. python -m pytest -q tests)
              fi
              if [ -d apps/services/geospatial-service/tests ]; then
                (cd apps/services/geospatial-service && PYTHONPATH=.:../../.. python -m pytest -q tests)
              fi
              if [ -d apps/services/integration-service/tests ]; then
                (cd apps/services/integration-service && PYTHONPATH=.:../../.. python -m pytest -q tests)
              fi
            displayName: Compile and run targeted Python tests

  - stage: Build
    displayName: Build available containers
    dependsOn: Validate
    jobs:
      - job: ContainerBuilds
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              set -euo pipefail
              build_if_present() {
                local name="$1"
                local context="$2"
                local dockerfile="$3"
                if [ -f "$context/$dockerfile" ]; then
                  echo "Building $name"
                  docker build --file "$context/$dockerfile" --tag "$name:$(imageTag)" "$context"
                else
                  echo "Skipping $name; $context/$dockerfile does not exist"
                fi
              }
              build_if_present ai-orchestration "$(Build.SourcesDirectory)" "apps/services/ai-orchestration-service/Dockerfile"
              build_if_present risk-service "apps/services/risk-service" "Dockerfile"
              build_if_present geospatial-service "$(Build.SourcesDirectory)" "apps/services/geospatial-service/Dockerfile"
              build_if_present integration-service "$(Build.SourcesDirectory)" "apps/services/integration-service/Dockerfile"
              build_if_present web "apps/web" "Dockerfile"
            displayName: Build service and frontend images when manifests exist

  - stage: DeployToACR
    displayName: Prepare ACR image build
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.enableDeploy }}', 'true'))
    jobs:
      - job: ACR
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Build available images in the existing ACR
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                test -n '${{ parameters.acrName }}' || { echo "acrName is required"; exit 2; }
                acr='${{ parameters.acrName }}'
                repo='ai-orchestration'
                if [ -f apps/services/ai-orchestration-service/Dockerfile ]; then
                  az acr build --registry "$acr" --image "$repo:$(imageTag)" \
                    --file apps/services/ai-orchestration-service/Dockerfile .
                else
                  echo "Skipping ACR build; AI service Dockerfile is absent"
                fi

  - stage: DeployToAKS
    displayName: Prepare AKS rollout
    dependsOn: DeployToACR
    condition: and(succeeded(), eq('${{ parameters.enableDeploy }}', 'true'))
    jobs:
      - deployment: AKS
        environment: aks
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Apply parameterized AKS manifest
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      test -n '${{ parameters.acrName }}' || { echo "acrName is required"; exit 2; }
                      test -n '${{ parameters.aksResourceGroup }}' || { echo "aksResourceGroup is required"; exit 2; }
                      test -n '${{ parameters.aksCluster }}' || { echo "aksCluster is required"; exit 2; }
                      az aks get-credentials \
                        --resource-group '${{ parameters.aksResourceGroup }}' \
                        --name '${{ parameters.aksCluster }}' \
                        --overwrite-existing
                      export ACR_LOGIN_SERVER="$(az acr show --name '${{ parameters.acrName }}' --query loginServer -o tsv)"
                      export IMAGE_TAG="$(imageTag)"
                      export NAMESPACE="infraiq"
                      export IMAGE_REPOSITORY="ai-orchestration"
                      deploy/kubernetes/deploy-aks.sh
